<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeb Graphics | User Signup</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a1a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 400px; background: #222; padding: 30px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); border-top: 4px solid #27ae60; }
        h2 { color: #f39c12; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #ddd; font-size: 14px; }
        input { width: 100%; padding: 10px; background: #333; border: 1px solid #444; color: #fff; border-radius: 5px; font-size: 14px; }
        .btn { width: 100%; background: #27ae60; color: white; padding: 12px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; transition: 0.3s; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #219653; }
        .switch-link { text-align: center; margin-top: 15px; font-size: 14px; color: #aaa; }
        .switch-link a { color: #f39c12; text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2><i class="fa-solid fa-user-plus"></i> Create Account</h2>
        <div class="form-group">
            <label>Full Name:</label>
            <input type="text" id="signup-name" placeholder="e.g., Mubeen Zeb">
        </div>
        <div class="form-group">
            <label>Username:</label>
            <input type="text" id="signup-username" placeholder="e.g., mubeenzeb">
        </div>
        <div class="form-group">
            <label>Nickname:</label>
            <input type="text" id="signup-nickname" placeholder="e.g., Mubi">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="signup-pass" placeholder="Enter password">
        </div>
        <button class="btn" onclick="registerUser()">Sign Up</button>
        <div class="switch-link">
            Already have an account? <a href="user-login.html">Login here</a>
        </div>
    </div>

    <script>
        function registerUser() {
            let name = document.getElementById('signup-name').value.trim();
            let username = document.getElementById('signup-username').value.trim().toLowerCase();
            let nickname = document.getElementById('signup-nickname').value.trim();
            let pass = document.getElementById('signup-pass').value.trim();

            if(!name || !username || !pass) {
                alert("Please fill in all required fields (Name, Username, Password).");
                return;
            }

            let users = JSON.parse(localStorage.getItem('siteUsers')) || [];
            
            // چیک کریں کہ یوزر نیم پہلے سے موجود تو نہیں
            let existing = users.find(u => u.username === username);
            if(existing) {
                alert("This username is already taken. Choose another one.");
                return;
            }

            let newUser = { name: name, username: username, nickname: nickname, password: pass, dp: "" };
            users.push(newUser);
            localStorage.setItem('siteUsers', JSON.stringify(users));
            localStorage.setItem('currentLoggedInUser', JSON.stringify(newUser));

            alert("Account created successfully!");
            window.location.href = "profile.html";
        }
    </script>
</body>
</html>
