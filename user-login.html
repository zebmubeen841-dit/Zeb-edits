<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeb Edits | User Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a1a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .auth-card { background: #222; padding: 40px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); width: 100%; max-width: 400px; border-top: 4px solid #27ae60; text-align: center; }
        h2 { margin-bottom: 25px; color: #27ae60; font-size: 24px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; color: #ddd; font-size: 14px; }
        input { width: 100%; padding: 12px; background: #333; border: 1px solid #444; color: #fff; border-radius: 5px; font-size: 15px; }
        .btn { background: #27ae60; color: white; padding: 12px; width: 100%; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn:hover { background: #219653; }
        .switch-link { display: inline-block; margin-top: 20px; color: #aaa; text-decoration: none; font-size: 14px; }
        .switch-link:hover { color: #fff; }
        .msg { margin-bottom: 15px; font-size: 14px; display: none; }
        .error { color: #e74c3c; }
        .success { color: #27ae60; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2><i class="fa-solid fa-user-circle"></i> User Login</h2>
        <div id="msg" class="msg"></div>
        
        <div class="form-group">
            <label for="login-email">Email Address:</label>
            <input type="email" id="login-email" placeholder="Enter your email">
        </div>
        <div class="form-group">
            <label for="login-pass">Password:</label>
            <input type="password" id="login-pass" placeholder="Enter password">
        </div>
        
        <button class="btn" onclick="loginUser()">Login</button>
        <br>
        <a href="user-signup.html" class="switch-link">Don't have an account? Sign Up</a>
        <br>
        <a href="index.html" class="switch-link" style="color: #f39c12;"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </div>

    <script>
        function loginUser() {
            let email = document.getElementById('login-email').value.trim();
            let pass = document.getElementById('login-pass').value.trim();
            let msgBox = document.getElementById('msg');

            if(!email || !pass) {
                msgBox.innerText = "Please fill in all fields.";
                msgBox.className = "msg error";
                msgBox.style.display = "block";
                return;
            }

            let users = JSON.parse(localStorage.getItem('siteUsers')) || [];
            let foundUser = users.find(u => u.email === email && u.pass === pass);

            if(foundUser) {
                localStorage.setItem('loggedUserName', foundUser.name);
                msgBox.innerText = "Login Successful! Redirecting...";
                msgBox.className = "msg success";
                msgBox.style.display = "block";
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1000);
            } else {
                msgBox.innerText = "Invalid email or password.";
                msgBox.className = "msg error";
                msgBox.style.display = "block";
            }
        }
    </script>
</body>
</html>
