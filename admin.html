<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login & Panel | Zeb Graphics</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <a href="index.html" class="custom-text-logo">ZEB <span>ADMIN</span></a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Website</a></li>
            </ul>
        </nav>
    </header>

    <!-- Login Form Section -->
    <div id="loginSection" class="admin-container" style="padding: 160px 8% 80px; display: flex; justify-content: center;">
        <div class="contact-form" style="width: 100%; max-width: 400px;">
            <div class="section-title" style="margin-bottom: 25px;">
                <h2>Admin Login</h2>
                <p>Enter password to access panel</p>
            </div>
            <form id="loginForm" style="display: flex; flex-direction: column; gap: 20px;">
                <input type="password" id="adminPassword" placeholder="Enter Password" required>
                <button type="submit" class="btn btn-gold">Login</button>
            </form>
        </div>
    </div>

    <!-- Upload Dashboard Section -->
    <div id="dashboardSection" class="admin-container" style="padding: 160px 8% 80px; display: none;">
        <div class="section-title">
            <h2>Admin Control Panel</h2>
            <p>Upload new gallery designs or manage content.</p>
        </div>
        <div class="contact-form" style="max-width: 600px; margin: 0 auto;">
            <h3>Upload New Work / Image</h3>
            <form id="uploadForm" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
                <input type="text" id="imgTitle" placeholder="Project Title (e.g. Luxury Logo)" required>
                <input type="text" id="imgCategory" placeholder="Category (e.g. Branding)" required>
                <input type="file" id="imageFile" accept="image/*" required style="color: var(--text-muted);">
                <button type="submit" class="btn btn-gold">Upload to Gallery</button>
            </form>
            <button id="logoutBtn" class="btn btn-outline" style="margin-top: 20px; width: 100%;">Logout</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Zeb Graphics Admin Panel.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
