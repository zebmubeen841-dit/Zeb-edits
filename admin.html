<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeb Graphics - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-container {
            max-width: 800px;
            margin: 40px auto;
            background: #141414;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid rgba(255,0,51,0.3);
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #222;
            padding-bottom: 15px;
        }
        .admin-header h2 {
            color: #ff0033;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #bbb;
            font-size: 14px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 5px;
            font-size: 14px;
        }
        .form-group textarea {
            height: 100px;
            resize: vertical;
        }
        .btn-save {
            background: #ff0033;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-save:hover {
            background: #cc0029;
        }
        .back-link {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            color: #fff;
        }
        .success-msg {
            background: rgba(0,255,100,0.1);
            color: #00ff66;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body style="background-color: #080808;">

    <div class="admin-container">
        <div class="admin-header">
            <h2><i class="fa-solid fa-gear"></i> ZEB GRAPHICS ADMIN PANEL</h2>
            <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> View Website</a>
        </div>

        <div id="successAlert" class="success-msg">Changes saved successfully! Website updated.</div>

        <form id="adminForm">
            <h3>Hero Section Control</h3>
            <div class="form-group">
                <label>Hero Subtitle Tag</label>
                <input type="text" id="heroSubtitle" value="WELCOME TO ZEB GRAPHICS">
            </div>
            <div class="form-group">
                <label>Hero Main Title</label>
                <input type="text" id="heroTitle" value="WE ARE CREATIVE DESIGN AGENCY">
            </div>
            <div class="form-group">
                <label>Hero Description</label>
                <textarea id="heroDesc">We turn ideas into stunning visuals and seamless experiences that inspire, engage, and elevate your brand to the next level.</textarea>
            </div>
            <div class="form-group">
                <label>Hero Button Text</label>
                <input type="text" id="heroBtnText" value="GET IN TOUCH">
            </div>
            <div class="form-group">
                <label>Upload Hero Image / Photo</label>
                <input type="file" id="heroImgFile" accept="image/*">
            </div>

            <hr style="border: 0; border-top: 1px solid #222; margin: 30px 0;">

            <h3>About Section Control</h3>
            <div class="form-group">
                <label>About Tag</label>
                <input type="text" id="aboutTag" value="ABOUT US">
            </div>
            <div class="form-group">
                <label>About Main Title</label>
                <input type="text" id="aboutTitle" value="We Bring Creative Ideas To Life.">
            </div>
            <div class="form-group">
                <label>About Subtitle Tag</label>
                <input type="text" id="aboutSubtitle" value="We love Creating">
            </div>
            <div class="form-group">
                <label>About Description</label>
                <textarea id="aboutDesc">Your ideas deserve more than just good design — they deserve attention, emotion, and results. We combine creativity, innovation, and strategy to transform your ideas into unique digital experiences that captivate audiences and grow your business. Every pixel, color, and interaction is crafted to reflect your brand's story in the most impactful way possible.</textarea>
            </div>
            <div class="form-group">
                <label>Upload About Image / Photo</label>
                <input type="file" id="aboutImgFile" accept="image/*">
            </div>

            <button type="submit" class="btn-save"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
        </form>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedData = JSON.parse(localStorage.getItem('zebGraphicsData'));
            if (savedData) {
                if(savedData.heroSubtitle) document.getElementById('heroSubtitle').value = savedData.heroSubtitle;
                if(savedData.heroTitle) document.getElementById('heroTitle').value = savedData.heroTitle;
                if(savedData.heroDesc) document.getElementById('heroDesc').value = savedData.heroDesc;
                if(savedData.heroBtnText) document.getElementById('heroBtnText').value = savedData.heroBtnText;
                
                if(savedData.aboutTag) document.getElementById('aboutTag').value = savedData.aboutTag;
                if(savedData.aboutTitle) document.getElementById('aboutTitle').value = savedData.aboutTitle;
                if(savedData.aboutSubtitle) document.getElementById('aboutSubtitle').value = savedData.aboutSubtitle;
                if(savedData.aboutDesc) document.getElementById('aboutDesc').value = savedData.aboutDesc;
            }
        });

        document.getElementById('adminForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const heroImgInput = document.getElementById('heroImgFile');
            const aboutImgInput = document.getElementById('aboutImgFile');

            let dataToSave = {
                heroSubtitle: document.getElementById('heroSubtitle').value,
                heroTitle: document.getElementById('heroTitle').value,
                heroDesc: document.getElementById('heroDesc').value,
                heroBtnText: document.getElementById('heroBtnText').value,
                aboutTag: document.getElementById('aboutTag').value,
                aboutTitle: document.getElementById('aboutTitle').value,
                aboutSubtitle: document.getElementById('aboutSubtitle').value,
                aboutDesc: document.getElementById('aboutDesc').value
            };

            const existingData = JSON.parse(localStorage.getItem('zebGraphicsData')) || {};
            dataToSave.heroImg = existingData.heroImg || '';
            dataToSave.aboutImg = existingData.aboutImg || '';

            let filesProcessed = 0;
            const checkDone = () => {
                filesProcessed++;
                if (filesProcessed >= 2) {
                    localStorage.setItem('zebGraphicsData', JSON.stringify(dataToSave));
                    document.getElementById('successAlert').style.display = 'block';
                    setTimeout(() => {
                        document.getElementById('successAlert').style.display = 'none';
                    }, 3000);
                }
            };

            if (heroImgInput.files && heroImgInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    dataToSave.heroImg = e.target.result;
                    checkDone();
                };
                reader.readAsDataURL(heroImgInput.files[0]);
            } else {
                checkDone();
            }

            if (aboutImgInput.files && aboutImgInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    dataToSave.aboutImg = e.target.result;
                    checkDone();
                };
                reader.readAsDataURL(aboutImgInput.files[0]);
            } else {
                checkDone();
            }
        });
    </script>
</body>
</html>
